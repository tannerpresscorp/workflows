name: Anthropic workload identity connection test

on:
  workflow_dispatch:
    inputs:
      audience:
        description: OIDC audience (must exactly match the Anthropic federation rule)
        required: true
        default: https://api.anthropic.com
        type: string

permissions:
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID || 'fdrl_01Up5HFEYyZkdMfRfkJjb3hY' }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID || '9e12e8f1-2011-4b25-8396-d28225b636ae' }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID || 'svac_01UfXKTP2Npf4e6UyT5cTwrC' }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_01JAYYx1FrDdQ9Y7kVsgh9eU' }}
      ANTHROPIC_MODEL: claude-sonnet-4-6
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: python -m pip install -r requirements-anthropic.txt
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          OIDC_AUDIENCE: ${{ inputs.audience }}
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            core.setSecret(token);
            fs.writeFileSync(process.env.ANTHROPIC_IDENTITY_TOKEN_FILE, token, {
              encoding: 'utf8',
              mode: 0o600,
              flag: 'wx',
            });
      - name: Exchange credentials and greet Claude
        run: python anthropic_connection_test.py
      - name: Remove the identity token
        if: always()
        shell: bash
        run: rm -f -- "$ANTHROPIC_IDENTITY_TOKEN_FILE"
